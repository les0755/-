<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>자정의 학교: 재료 탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Gowun+Dodum&family=Nanum+Pen+Script&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
:root{--red:#c4302b;--red2:#7a1512;--ink:#e9e3d5;--dim:#9b9385;--ok:#4caf72;--paper:#efe6cf;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050608;color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
#app{height:100%;display:flex;flex-direction:column}
#app.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}

/* HUD */
#hud{display:flex;align-items:center;gap:14px;padding:8px 14px;background:linear-gradient(#120b0c,#0a0708);border-bottom:1px solid #3a1212;flex-wrap:wrap;z-index:20}
#hud .logo{font-family:'East Sea Dokdo';font-size:30px;color:var(--red);line-height:1;text-shadow:0 0 10px #ff000055;letter-spacing:1px}
.hgrp{display:flex;align-items:center;gap:8px;font-family:'Do Hyeon';font-size:15px;color:#cfc6b6}
.bat{width:110px;height:20px;border:2px solid #aaa;border-radius:4px;position:relative;padding:2px}
.bat:after{content:'';position:absolute;right:-7px;top:4px;width:4px;height:8px;background:#aaa;border-radius:0 2px 2px 0}
.bat i{display:block;height:100%;border-radius:2px;transition:width .4s,background .4s}
.keys{display:flex;gap:5px}
.key{width:34px;height:34px;border:1px dashed #4a3a32;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'Do Hyeon';font-size:18px;color:#555;background:#0d0a09}
.key.on{border:1px solid #d6a738;color:#ffd166;background:#2a1f0c;box-shadow:0 0 10px #d6a73866}
.sp{flex:1}
.hbtn{background:#1a1011;color:var(--ink);border:1px solid #5a1d1d;border-radius:9px;padding:7px 12px;font-family:'Do Hyeon';font-size:15px;transition:.2s}
.hbtn:hover{background:#3a1416;box-shadow:0 0 12px #c4302b55}
.hbtn.pulse{animation:pulse 1s 3}
@keyframes pulse{50%{background:#6b1a1a;box-shadow:0 0 22px #ff5a4a}}

#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:10px;position:relative}

/* Intro */
.intro{max-width:760px;width:100%;text-align:center;padding:30px 24px;position:relative}
.intro h1{font-family:'East Sea Dokdo';font-size:clamp(64px,11vw,120px);margin:0;color:var(--red);line-height:.9;text-shadow:0 0 18px #ff1a1a88,0 4px 0 #3a0000;animation:flick 4s infinite}
.intro h2{font-family:'Do Hyeon';font-weight:400;color:#bdb3a2;margin:6px 0 22px;font-size:20px}
.story{font-size:17px;line-height:1.85;color:#d8cfbf;text-align:left;background:#0e0b0b;border:1px solid #2c1a1a;border-radius:12px;padding:18px 22px;min-height:190px;white-space:pre-line}
.story b{color:#ff6b5e}
.irow{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.irow input{background:#120d0d;border:1px solid #5a1d1d;color:var(--ink);border-radius:10px;padding:12px 14px;font-size:17px;width:260px;font-family:inherit}
.bigbtn{background:linear-gradient(#8f1d18,#5a0f0c);color:#fff;border:1px solid #c4302b;border-radius:12px;padding:12px 26px;font-family:'Do Hyeon';font-size:21px;box-shadow:0 0 18px #c4302b55;transition:.2s}
.bigbtn:hover{transform:translateY(-2px);box-shadow:0 0 28px #ff3b30aa}
.bigbtn.ghost{background:#141010;border-color:#4a3030;box-shadow:none;font-size:17px}
@keyframes flick{0%,19%,21%,62%,64%,100%{opacity:1}20%,63%{opacity:.35}}

/* Scene */
.scene{position:relative;width:min(100%,calc((100vh - 90px)*16/9));aspect-ratio:16/9;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px #2a1a1a,0 20px 60px #000;background:#000;touch-action:manipulation}
.scene .bg,.scene .bg svg{position:absolute;inset:0;width:100%;height:100%}
.hs{position:absolute;cursor:pointer;transition:transform .2s,filter .2s;filter:drop-shadow(0 6px 8px #000)}
.hs svg{width:100%;height:auto;display:block}
.hs.region{border-radius:10px}
.hs:hover{transform:scale(1.04);filter:brightness(1.35) drop-shadow(0 0 12px #ffcf8a88)}
.hs.region:hover{transform:none;background:#ffffff10;box-shadow:inset 0 0 0 2px #ffffff30}
.dark{position:absolute;inset:0;pointer-events:none;z-index:3;transition:background .15s}
.lbls{position:absolute;inset:0;pointer-events:none;z-index:4}
.lbl{position:absolute;transform:translateX(-50%);font-family:'Do Hyeon';font-size:clamp(11px,1.25vw,16px);background:#000000c0;border:1px solid #ffffff22;color:#efe7d7;padding:3px 9px;border-radius:999px;white-space:nowrap}
.lbl.todo{border-color:#ffcf6b88;color:#ffe3a3;box-shadow:0 0 10px #ffcf6b44}
.lbl.todo:before{content:'✦ ';color:#ffcf6b;animation:tw 1.4s infinite}
.lbl.done{color:#8fe0a8;border-color:#4caf7288}
.lbl.door{border-color:#c4302b;color:#ff9c90}
.lbl.doorok{border-color:#ffd166;color:#ffd166;box-shadow:0 0 14px #ffd16688;animation:pulse2 1.2s infinite}
@keyframes pulse2{50%{box-shadow:0 0 26px #ffd166}}
@keyframes tw{50%{opacity:.2}}
.rtitle{position:absolute;left:14px;top:12px;z-index:5;font-family:'East Sea Dokdo';font-size:clamp(26px,3.3vw,44px);color:#ff5c50;text-shadow:0 0 12px #000,0 0 18px #ff000066;line-height:1}
.rtitle small{display:block;font-family:'Do Hyeon';font-size:clamp(12px,1.2vw,16px);color:#d9cdb8;margin-top:4px;text-shadow:0 0 6px #000}
.back{position:absolute;right:12px;top:12px;z-index:6}
.prog{position:absolute;left:14px;bottom:12px;z-index:6;font-family:'Do Hyeon';font-size:clamp(12px,1.2vw,15px);background:#000000b0;padding:6px 12px;border-radius:10px;border:1px solid #333}
.flick{animation:flick 5s infinite}
.glow{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.55}}
.blink{animation:blink 5s infinite}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}

/* Map */
.map text{font-family:'Do Hyeon'}
.mroom{cursor:pointer}
.mroom:hover rect.mr{filter:brightness(1.5)}
.mroom.open rect.mr{animation:mopen 1.6s infinite}
@keyframes mopen{50%{stroke:#ff6b5e;stroke-width:6}}

/* Modal */
#modal{position:fixed;inset:0;background:#000000cc;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(2px)}
.mbox{width:min(1040px,100%);max-height:94vh;overflow:auto;background:linear-gradient(#17110f,#0f0b0a);border:1px solid #4a2420;border-radius:16px;padding:20px 22px;box-shadow:0 0 50px #000,0 0 30px #7a151244;position:relative}
.mbox h2{font-family:'East Sea Dokdo';font-size:44px;margin:0 0 4px;color:#ff6a5c;font-weight:400;line-height:1}
.mstory{color:#d8cdbb;font-size:16px;line-height:1.7;margin:4px 0 10px}
.mhint{font-size:14px;color:#ffd98a;background:#2a200c;border:1px dashed #6b5320;padding:7px 12px;border-radius:10px;display:inline-block;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:12px}
.card{background:#1d1714;border:2px solid #3b2c25;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;transition:border-color .3s}
.card .pic{height:104px;display:flex;align-items:center;justify-content:center;background:radial-gradient(#3a302a,#1d1714 70%);border-radius:10px}
.card .pic svg{height:94px;width:auto;max-width:100%}
.card .q{font-size:15px;line-height:1.55;flex:1}
.card .q.say{font-family:'Nanum Pen Script';font-size:22px;line-height:1.25;color:#f4d9c4}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{background:#2a201c;color:var(--ink);border:1px solid #5c4438;border-radius:9px;padding:7px 10px;font-size:14px;font-family:'Do Hyeon';transition:.15s}
.opt:hover{background:#4a2a22;border-color:#c4302b}
.card.ok{border-color:#3f8f5a;background:#14201a}
.card .ans{font-family:'Do Hyeon';font-size:18px;color:#8fe0a8}
.card .exp{font-size:13.5px;color:#b9d8c2;line-height:1.5}
.card.bad{animation:shake .4s;border-color:#c4302b}
.card .wrongmsg{font-size:13.5px;color:#ff9c90;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#231b18;border:1px solid #5c4438;color:#e2d6c4;border-radius:999px;padding:6px 11px;font-size:14px;font-family:'Do Hyeon'}
.chip.on{background:#7a3a12;border-color:#ffb36b;color:#fff;box-shadow:0 0 10px #ff8a3a77}
.melt{background:linear-gradient(#d2691e,#7a3208);border:1px solid #ffb36b;color:#fff;border-radius:10px;padding:8px;font-family:'Do Hyeon';font-size:16px}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;align-items:center}
.mfoot .msg{flex:1;color:#8fe0a8;font-family:'Do Hyeon';font-size:17px}
.xbtn{position:absolute;right:12px;top:10px;background:none;border:none;color:#aaa;font-size:28px}
.solvedban{background:#14301f;border:1px solid #4caf72;color:#bff0cf;border-radius:12px;padding:10px 14px;margin:0 0 12px;font-family:'Do Hyeon';font-size:17px}

/* Note (paper) */
.paper{background:var(--paper);color:#2a211a;border-radius:6px;padding:26px 30px;position:relative;box-shadow:inset 0 0 60px #b9a77a88;font-size:16.5px;line-height:1.85;clip-path:polygon(0 0,100% 0,100% 96%,96% 100%,88% 97%,78% 100%,66% 97%,52% 100%,40% 97%,28% 100%,15% 97%,5% 100%,0 97%)}
.paper h3{font-family:'Do Hyeon';font-weight:400;font-size:24px;margin:0 0 10px;color:#5a1010}
.paper .hand{font-family:'Nanum Pen Script';font-size:24px;line-height:1.25;color:#7a1512}
.paper b{color:#8a1a12}
.paper .row{margin:6px 0;padding-left:12px;border-left:3px solid #c9b48a}
.stain{position:absolute;right:24px;top:18px;width:70px;height:70px;border-radius:50%;background:radial-gradient(#8a1a1233,#8a1a1222 60%,transparent 70%)}

/* keypad */
.lockbox{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.lockq{flex:1;min-width:260px}
.lockq .qq{font-size:18px;line-height:1.7;background:#0d0a09;border:1px solid #3a2520;border-radius:12px;padding:14px 16px}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
.pad button{height:56px;border-radius:12px;border:1px solid #6a5a48;background:linear-gradient(#3a3330,#1e1a18);color:#f1e6d2;font-family:'Do Hyeon';font-size:24px}
.pad button:hover{background:#5a3a2a}
.screen{grid-column:1/-1;height:58px;border-radius:10px;background:#0a1a0e;border:2px solid #2f5a3a;color:#7dffa0;font-family:'Do Hyeon';font-size:32px;display:flex;align-items:center;justify-content:center;letter-spacing:10px;text-shadow:0 0 8px #3dff7a}

/* Sheet */
#sheet{position:fixed;top:0;right:0;height:100%;width:min(820px,100%);background:#f4eddc;color:#231d17;z-index:60;transform:translateX(102%);transition:transform .35s ease;display:flex;flex-direction:column;box-shadow:-20px 0 60px #000}
#sheet.open{transform:none}
.shead{padding:14px 20px;border-bottom:2px solid #c9b48a;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#ebe1c8}
.shead h3{margin:0;font-family:'Do Hyeon';font-weight:400;font-size:24px;color:#5a1010;flex:1}
.pbar{width:100%;height:10px;background:#d9cfb6;border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#8a1a12,#d6492f);transition:width .5s}
.sbody{overflow:auto;padding:16px 20px 40px;flex:1}
.sbtn{background:#fff8e6;border:1px solid #b9a77a;color:#3a2a1a;border-radius:9px;padding:7px 12px;font-family:'Do Hyeon';font-size:15px}
.ws h4{font-family:'Do Hyeon';font-weight:400;font-size:20px;margin:18px 0 8px;color:#fff;background:#5a1d1a;padding:6px 12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.ws h4 span{font-size:14px;opacity:.85}
.ws table{width:100%;border-collapse:collapse;font-size:14.5px;background:#fffaf0}
.ws th,.ws td{border:1px solid #c9b48a;padding:7px 8px;vertical-align:top;text-align:left}
.ws th{background:#e9dcbd;font-family:'Do Hyeon';font-weight:400;font-size:15px;white-space:nowrap}
.ws td.nm{font-family:'Do Hyeon';font-size:16px;background:#f3e8cc;white-space:nowrap}
.ws .def{background:#fffaf0;border:1px solid #c9b48a;padding:8px 10px;margin:6px 0;font-size:15px;border-radius:6px}
.bl{display:inline;border-bottom:2px dashed #b0a383;color:#a49778;font-size:13px;padding:0 4px}
.bl.ok{border-bottom:2px solid #c4302b44;color:#1a3a8a;font-family:'Nanum Pen Script';font-size:22px;line-height:1.15}
.bl.new{animation:newbl 2.2s}
.bl.tch{color:#8a1a12}
@keyframes newbl{0%{background:#ffe066}100%{background:transparent}}
.sname{font-family:'Do Hyeon';font-size:16px;color:#5a4a3a}

/* scare */
#flash{position:fixed;inset:0;pointer-events:none;z-index:70;background:radial-gradient(transparent 30%,#a00000cc);opacity:0}
#flash.go{animation:fl .7s}
@keyframes fl{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
#whisper{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:71;font-family:'East Sea Dokdo';font-size:clamp(36px,6vw,70px);color:#ff3b30;text-shadow:0 0 18px #000,0 0 30px #ff000088;pointer-events:none;opacity:0;white-space:nowrap}
#whisper.go{animation:wh 1.8s}
@keyframes wh{0%{opacity:0;letter-spacing:20px}20%{opacity:1;letter-spacing:2px}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-20px)}}
#jump{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#jump svg{width:min(70vw,460px);animation:jz .6s cubic-bezier(.2,2,.4,1)}
@keyframes jz{0%{transform:scale(.2) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
#jump p{font-family:'Do Hyeon';font-size:22px;color:#ffb3aa;text-align:center;margin:0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tst{background:#1b1310ee;border:1px solid #6a4a2a;color:#ffe9c4;font-family:'Do Hyeon';font-size:16px;padding:9px 16px;border-radius:12px;box-shadow:0 8px 30px #000;animation:tin .3s, tout .5s 3.2s forwards;max-width:90vw;text-align:center}
.tst.green{border-color:#4caf72;color:#c9f5d6}
.tst.red{border-color:#c4302b;color:#ffb3aa}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
@keyframes tout{to{opacity:0}}

/* end */
.cert{max-width:760px;background:var(--paper);color:#2a211a;border-radius:10px;padding:30px 34px;text-align:center;box-shadow:0 0 60px #ffd16633;border:6px double #8a6a2a}
.cert h1{font-family:'East Sea Dokdo';font-size:72px;margin:0;color:#8a1a12;font-weight:400;line-height:1}
.cert .stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.cert .stat{background:#fff8e6;border:1px solid #c9b48a;border-radius:10px;padding:10px 16px;font-family:'Do Hyeon';font-size:15px;min-width:110px}
.cert .stat b{display:block;font-size:26px;color:#8a1a12}
@media (max-width:700px){#hud .logo{font-size:24px}.bat{width:80px}.key{width:28px;height:28px;font-size:15px}.hbtn{padding:6px 9px;font-size:14px}}
</style>
</head>
<body>
<div id="app">
  <header id="hud" class="hidden">
    <div class="logo">자정의 학교</div>
    <div class="hgrp" title="손전등 배터리 – 틀리면 줄어들어요">🔦 <div class="bat"><i id="batI"></i></div><span id="batT"></span></div>
    <div class="hgrp">🗝️ <div class="keys" id="keysEl"></div></div>
    <div class="sp"></div>
    <div class="hgrp">⏱ <span id="timer">00:00</span></div>
    <button class="hbtn" id="sheetBtn">📝 학습지 <span id="sheetPct"></span></button>
    <button class="hbtn" id="sndBtn" title="소리 켜기/끄기">🔊</button>
  </header>
  <main id="stage"></main>
</div>
<div id="modal" class="hidden"><div class="mbox" id="mbox"></div></div>
<aside id="sheet">
  <div class="shead">
    <h3>📝 재료의 이해 학습지 <span class="sname" id="sName"></span></h3>
    <button class="sbtn" id="copyBtn">📋 텍스트 복사</button>
    <button class="sbtn" id="closeSheet">닫기 ✕</button>
    <div class="pbar"><i id="sPbar"></i></div>
  </div>
  <div class="sbody"><div class="ws" id="ws"></div></div>
</aside>
<div id="flash"></div><div id="whisper"></div>
<div id="jump" class="hidden"></div>
<div id="toast"></div>

<script>
/* =========================================================
   공통 유틸 & 아이콘(SVG)
========================================================= */
const $=s=>document.querySelector(s);
const sv=(b,vb='0 0 100 100')=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${b}</svg>`;
function gear(cx,cy,r1,r2,n,fill){let p=[];for(let i=0;i<n;i++){const a=i*2*Math.PI/n,s=Math.PI/n;[[a-s*.55,r1],[a-s*.3,r2],[a+s*.3,r2],[a+s*.55,r1]].forEach(([t,r])=>p.push((cx+r*Math.cos(t)).toFixed(1)+','+(cy+r*Math.sin(t)).toFixed(1)));}
 return `<polygon points="${p.join(' ')}" fill="${fill}" stroke="#4d5259" stroke-width="1.5"/><circle cx="${cx}" cy="${cy}" r="${r1*.35}" fill="#1d1714" stroke="#4d5259"/>`}
function manholeGrid(){let s='';for(let x=-32;x<=24;x+=8)for(let y=-32;y<=24;y+=8){if((x+4)**2+(y+4)**2<30*30)s+=`<rect x="${50+x+1}" y="${50+y+1}" width="6" height="6" rx="1" fill="#2a2a2c"/>`}return s}
const paperIcon=(c='#efe4c8')=>sv(`<path d="M18 8h50l14 14v70H18z" fill="${c}"/><path d="M68 8v14h14" fill="#cdbd94"/><g stroke="#9a8a6a" stroke-width="2"><line x1="27" y1="34" x2="73" y2="34"/><line x1="27" y1="44" x2="73" y2="44"/><line x1="27" y1="54" x2="66" y2="54"/><line x1="27" y1="64" x2="72" y2="64"/><line x1="27" y1="74" x2="58" y2="74"/></g><circle cx="66" cy="78" r="7" fill="#8a1a1255"/>`);
const I={
 ingot:sv(`<polygon points="12,72 28,56 76,56 90,72" fill="#9aa0a8"/><polygon points="12,72 90,72 86,84 16,84" fill="#5d6169"/><polygon points="24,52 38,36 70,36 82,52" fill="#b4b9c1"/><polygon points="24,52 82,52 79,61 27,61" fill="#6c7078"/><text x="53" y="49" font-size="11" text-anchor="middle" fill="#3a3d42" font-weight="bold">Fe</text>`),

 sci_n1:{title:'찢어진 실험 노트 (1)',html:`<p class="hand">…이 학교 과학실엔 '철 3형제' 표본이 있다.</p>
 <p>셋 다 <b>철을 주성분으로 하는 금속</b>, 즉 <b>철 금속</b>이다. 하지만 섞여 있는 <b>탄소(C)의 양</b>이 다르다.</p>
 <div class="row">🥄 <b>순철</b> — 탄소가 <b>거의 없는</b> ‘순수한’ 철</div>
 <div class="row">⚙️ <b>탄소강</b> — 탄소 함량 <b>0.03 ~ 2%</b></div>
 <div class="row">🍲 <b>주철</b> — 탄소 함량 <b>3 ~ 6%</b> (쇠를 녹여 틀에 <b>부어(鑄)</b> 만든다고 해서 주철)</div>
 <p class="hand">탄소가 많아질수록 단단해지지만, 잘 휘거나 늘어나지 않는다… 다음 장은 해골이 가져갔다.</p>`},
 sci_n2:{title:'해골이 움켜쥔 쪽지 (2)',html:`<div class="row"><b>순철</b>: 재질이 <b>연하고 전기가 잘 통한다</b>.<br>→ 전기용 재료, 실험용 재료</div>
 <div class="row"><b>탄소강</b>: <b>가공성·강도·경도</b>가 우수하다. 뜨겁게 달궜다 식히는 <b>열처리</b>로 성질을 바꿀 수 있다.<br>→ 기계 부품 (톱니바퀴, 축 …)</div>
 <div class="row"><b>주철</b>: <b>압축에 강하고</b>, 잘 휘거나 늘어나지 않으며, <b>녹이 잘 슬지 않는다</b>.<br>→ 기계 몸체, 취사도구(가마솥), 맨홀 뚜껑</div>
 <p class="hand">문의 자물쇠는… 탄소를 가장 많이 품은 철에게 물어봐…</p>`},
 tech_n1:{title:'기술 선생님의 작업 일지',html:`<p>철이 아닌 금속을 <b>비철 금속</b>이라고 한다. 오늘은 구리와 알루미늄을 정리해 두자.</p>
 <div class="row">🟠 <b>구리</b>: <b>전기와 열이 잘 통하고</b>, 녹이 잘 슬지 않는다. <b>전성</b>(두드리면 얇게 펴지는 성질)과 <b>연성</b>(당기면 길게 늘어나는 성질)이 뛰어나 가공성이 좋다.<br>→ <b>전선</b></div>
 <div class="row">⚪ <b>알루미늄</b>: <b>가볍고</b> 전기가 잘 통하며, 공기 중에서 녹이 잘 슬지 않는다.<br>→ <b>음료수 용기(캔), 창틀</b></div>
 <p class="hand">…그런데 오늘 밤 용광로가 혼자 켜져 있었다.</p>`},
 tech_n2:{title:'용광로 옆 합금 레시피',html:`<p><b>합금</b>: 기계적 성질을 개선하기 위해 금속에 <b>다른 금속이나 비금속을 합쳐서</b> 만든 금속. (녹이 잘 슬거나 강도가 부족한 단점을 보완!)</p>
 <div class="row">🗿 <b>청동</b> = 구리 + <b>주석</b> → 경도가 높고 마모에 강함 → 기계 부품, 동전, 동상</div>
 <div class="row">🎺 <b>황동</b> = 구리 + <b>아연</b> → 색이 아름답고 가공성이 좋음 → 악기, 파이프</div>
 <div class="row">✈️ <b>두랄루민</b> = <b>알루미늄 + 구리 + 마그네슘</b> → 가볍고 강도가 뛰어남 → 비행기·자동차 부품, 등산 장비</div>
 <p class="hand">외우는 꿀팁: 청동은 ‘청주’(주석), 황동은 ‘황아’(아연)! 두랄루민은 ‘알·구·마’!</p>`},
 caf_n1:{title:'게시판의 분리배출 안내문',html:`<p><b>열가소성 플라스틱</b>은 열을 가하면 녹아서 모양을 바꿀 수 있고, 식으면 굳는다. 초콜릿처럼 <b>여러 번 반복</b>할 수 있다!<br>그래서 대부분 <b>녹여서 재생</b>할 수 있으니 사용 후 <b>분리 배출</b>을 잘하자.</p>
 <div class="row"><b>PS 폴리스티렌</b>: 가공하기 쉽다. 열을 잘 차단하지만, <b>가열하면 유해 물질</b>이 배출된다.</div>
 <div class="row"><b>PP 폴리프로필렌</b>: 가볍고 튼튼하다. <b>고온에서 잘 변형되지 않으며</b>, 유해 물질이 발생하지 않는다.</div>
 <div class="row"><b>PVC 폴리염화 비닐</b>: <b>내구성·내부식성</b>이 뛰어나다. 평소에는 안정적이지만, <b>가열하면 유해 물질</b>이 배출된다.</div>
 <div class="row"><b>PET 폴리에틸렌 테레프탈레이트</b>: <b>투명하고 가볍다</b>. 독성에 매우 안전하다.</div>`},
 caf_n2:{title:'영양사 선생님의 일지 (케첩 자국…이겠지?)',html:`<p class="hand">급식실 물건들, 무엇으로 만들었는지 적어 둔다.</p>
 <div class="row"><b>PS</b> → 일회용 용기(컵라면 용기), 단열재, 완충재(스티로폼)</div>
 <div class="row"><b>PP</b> → 밀폐 용기, 도시락, 컵, 자동차 내·외장재</div>
 <div class="row"><b>PVC</b> → 상하수도 관, 호스, 화학 약품 용기, 절연체</div>
 <div class="row"><b>PET</b> → 음료용 페트병, 포장재</div>
 <p class="hand">냉장고 자물쇠 비밀번호는… ‘가열하면 위험한 녀석들’의 수.</p>`},
 art_n1:{title:'미술 선생님의 레진아트 노트',html:`<p><b>열경화성 플라스틱</b>은 열을 가해 <b>한 번 굳으면, 다시 가열해도 녹지 않는다</b>. 달걀 프라이를 다시 날달걀로 못 돌리는 것처럼! 열에 강하지만 녹여서 재생하기는 어렵다.</p>
 <div class="row">💧 <b>에폭시 수지</b>: <b>내수성·접착성</b>이 우수하고 <b>빨리 굳는다</b>. → 강화 플라스틱, 공예 접착제, 보호용 코팅 (레진 아트도 에폭시!)</div>
 <div class="row">🏎️ <b>탄소 섬유 강화 플라스틱</b> = <b>탄소 섬유 + 에폭시 수지</b></div>
 <p class="hand">나머지는… 석고상이 알고 있다.</p>`},
 art_n2:{title:'석고상 받침대 밑의 쪽지',html:`<div class="row">🔌 <b>페놀 수지</b>: <b>기계적 강도</b>가 높고 <b>내열성, 전기 절연성</b>이 우수하다. → 전기 기구, 회로 기판, 접착제</div>
 <div class="row">🍽️ <b>멜라민 수지</b>: <b>내수성·내열성</b>이 우수하고 <b>착색이 자유롭다</b>. → 식기, 전기 기구, 배선 기구</div>
 <div class="row">🏎️ <b>탄소 섬유 강화 플라스틱</b>: <b>가벼우면서도 금속처럼 단단</b>하다. → 비행기·자동차 부품</div>
 <p class="hand">문을 열고 싶다면… ‘물에 강하다’는 말이 몇 번 나왔는지 세어 봐.</p>`}
};

/* =========================================================
   사운드 (Web Audio)
========================================================= */
let AC=null,drone=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='sine',v=.12,delay=0,f2){const a=ac();if(!a||!S.sound)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,v=.2){const a=ac();if(!a||!S.sound)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(a.destination);s.start()}
const sfx={
 ok(){tone(660,.18,'triangle',.12);tone(990,.3,'triangle',.1,.1)},
 bad(){tone(140,.5,'sawtooth',.12,0,50);noise(.25,.08)},
 key(){[523,659,784,1047].forEach((f,i)=>tone(f,.35,'triangle',.11,i*.1))},
 scare(){noise(.9,.35);tone(1400,.9,'sawtooth',.13,0,120);tone(90,1,'square',.1)},
 paper(){noise(.15,.06)},
 creak(){tone(320,.6,'sawtooth',.04,0,180)}
};
function startDrone(){if(!S.sound||drone)return;const a=ac();if(!a)return;const g=a.createGain();g.gain.value=.028;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=260;const os=[55,58.2,82.4].map(f=>{const o=a.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(lp);o.start();return o});lp.connect(g);g.connect(a.destination);drone={g,os}}
function stopDrone(){if(drone){drone.os.forEach(o=>{try{o.stop()}catch(e){}});drone.g.disconnect();drone=null}}

let pointer={x:.5,y:.5};
function renderRoom(id){
 cur=id;const r=ROOM_BY[id];$('#modal').classList.add('hidden');updHUD();
 const isGate=id==='gate';
 const hsHTML=r.hs.map((h,i)=>{const st=`left:${h.x}%;top:${h.y}%;width:${h.w}%;${h.h?`height:${h.h}%;`:''}`;return `<div class="hs ${h.region?'region':''}" data-i="${i}" style="${st}">${h.icon?I[h.icon]:''}</div>`}).join('');
 $('#stage').innerHTML=`<div class="scene" id="scene"><div class="bg">${isGate?gateBG():roomBG(r)}</div>${hsHTML}<div class="dark" id="dark"></div><div class="lbls" id="lbls"></div>
 <div class="rtitle">${isGate?'교문 — 마지막 관문':r.floor+' '+r.name}<small>${isGate?'저울과 소각로의 시험을 통과하고 열쇠 번호를 입력하라':r.theme}</small></div>
 <button class="hbtn back" id="backB">← 복도로</button><div class="prog" id="prog"></div></div>`;
 const sc=$('#scene');
 sc.querySelectorAll('.hs').forEach(el=>el.onclick=()=>hsClick(r,r.hs[+el.dataset.i]));
 sc.addEventListener('pointermove',e=>{const b=sc.getBoundingClientRect();pointer={x:(e.clientX-b.left)/b.width,y:(e.clientY-b.top)/b.height};updDark()});
 $('#backB').onclick=renderMap;
 requestAnimationFrame(()=>{layoutLabels(r);updDark()});
 if(!isGate&&!S['visited_'+id]){S['visited_'+id]=1;save();setTimeout(()=>whisper(r.name+'…'),200);}
}
function layoutLabels(r){
 const sc=$('#scene');if(!sc)return;const b=sc.getBoundingClientRect();
 let html='';let done=0,total=0;
 r.hs.forEach((h,i)=>{const el=sc.querySelector(`.hs[data-i="${i}"]`);const e=el.getBoundingClientRect();const x=(e.left-b.left+e.width/2)/b.width*100,y=(e.bottom-b.top)/b.height*100+.6;
  let cls='',txt=h.label;
  if(h.p){total++;if(puzDone(h.p)){cls='done';txt='✔ '+h.label;done++}else cls='todo'}
  else if(h.n){cls=S.read[h.n]?'done':'todo';txt=(S.read[h.n]?'📄 ':'')+h.label}
  else if(h.door){if(S.keys[r.id]){cls='done';txt='🗝️ 열림 ('+S.keys[r.id]+')'}else if(roomReady(r)){cls='doorok';txt='🗝️ 자물쇠 열기!'}else{cls='door';txt='🔒 '+h.label}}
  else if(h.final){cls=S.end?'done':(puzDone('fin_metal')&&puzDone('fin_plastic'))?'doorok':'door';txt=(cls==='doorok'?'🗝️ ':'🔒 ')+h.label}
  html+=`<div class="lbl ${cls}" style="left:${x}%;top:${Math.min(y,95)}%">${txt}</div>`});
 $('#lbls').innerHTML=html;
 $('#prog').innerHTML=`퍼즐 ${done}/${total} 해결 · 단서 ${r.hs.filter(h=>h.n&&S.read[h.n]).length}/${r.hs.filter(h=>h.n).length} 확인`;
}
window.addEventListener('resize',()=>{if(ROOM_BY[cur])layoutLabels(ROOM_BY[cur])});
function updDark(){const d=$('#dark'),sc=$('#scene');if(!d||!sc)return;const w=sc.clientWidth;const rad=w*(.16+Math.max(0,S.battery)/100*.2);
 d.style.background=`radial-gradient(circle ${rad}px at ${pointer.x*100}% ${pointer.y*100}%, rgba(0,0,0,0) 0, rgba(0,0,0,.18) 55%, rgba(0,0,0,${(.72+(100-S.battery)/100*.18).toFixed(2)}) 100%)`}
function hsClick(r,h){
 if(h.scare){sfx.creak();whisper('…');toast('👻 '+h.scare,'red');return}
 if(h.n){openNote(h.n);return}
 if(h.p){openPuzzle(h.p);return}
 if(h.door){if(S.keys[r.id]){renderMap();return}if(!roomReady(r)){const left=roomPuzzles(r).filter(p=>!puzDone(p)).length;sfx.creak();toast(`🔒 문이 꿈쩍도 하지 않는다… (남은 퍼즐 ${left}개)`,'red');return}openDoor(r);return}
 if(h.final){if(!(puzDone('fin_metal')&&puzDone('fin_plastic'))){sfx.creak();toast('🔒 자물쇠가 반응하지 않는다. 저울과 소각로의 시험을 먼저 통과해!','red');return}openFinal();return}
}

 bindCards();
}
function cardHTML(pid,i){const P=PUZ[pid],it=P.items[i],k=pid+':'+i,ok=S.solved[k];
 const ansTxt=it.craft?it.a.join(' + '):it.a;
 if(it.craft){
  return `<div class="card ${ok?'ok':''}" id="c${i}"><div class="pic">${I.furnace}</div><div class="q">🔥 주문서: <b style="font-size:18px;color:#ffb36b">${it.target}</b>을(를) 만들어라!</div>
  ${ok?`<div class="ans">✔ ${it.target} = ${ansTxt}</div><div class="exp">${it.exp||''}</div>`:`<div class="chips">${it.pool.map(m=>`<button class="chip" data-chip="${m}">${m}</button>`).join('')}</div><button class="melt" data-melt="${i}">🔥 녹이기</button><div class="wrongmsg"></div>`}</div>`}
 const opts=it.o||P.o;
 return `<div class="card ${ok?'ok':''}" id="c${i}"><div class="pic">${it.pic||''}</div><div class="q ${it.say?'say':''}">${it.q}</div>
 ${ok?`<div class="ans">✔ ${ansTxt}</div>${it.exp?`<div class="exp">${it.exp}</div>`:''}`:`<div class="opts">${opts.map(o=>`<button class="opt" data-i="${i}" data-o="${o}">${o}</button>`).join('')}</div><div class="wrongmsg"></div>`}</div>`}
function bindCards(){
 document.querySelectorAll('#mbox .opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i,b.dataset.o));
 document.querySelectorAll('#mbox .chip').forEach(b=>b.onclick=()=>{b.classList.toggle('on');tone(400+Math.random()*200,.08,'triangle',.05)});
 document.querySelectorAll('#mbox .melt').forEach(b=>b.onclick=()=>{const i=+b.dataset.melt,card=$('#c'+i);const sel=[...card.querySelectorAll('.chip.on')].map(c=>c.dataset.chip);const it=PUZ[curP].items[i];
  const ok=sel.length===it.a.length&&it.a.every(m=>sel.includes(m));if(ok)solve(i);else{wrong(card,sel.length?`용광로가 부글부글 넘친다! ${it.target}의 재료가 아니야. 레시피 쪽지를 다시 봐.`:'재료를 먼저 골라 넣어!');card.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'))}});
}
function answer(i,o){const it=PUZ[curP].items[i];if(o===it.a)solve(i);else wrong($('#c'+i),`“${o}”… 아니야. ${PUZ[curP].hint}`)}
function solve(i){const k=curP+':'+i;const before=new Set(Object.keys(B).filter(blankDone));S.solved[k]=true;S.battery=Math.min(100,S.battery+3);
 const nb=Object.keys(B).filter(b=>blankDone(b)&&!before.has(b));nb.forEach(b=>newBlanks.add(b));save();sfx.ok();
 const card=$('#c'+i);card.outerHTML=cardHTML(curP,i);bindCards();
 if(nb.length){toast(`📝 학습지에 <b>${nb.length}칸</b>이 기록되었다!`,'green');$('#sheetBtn').classList.remove('pulse');void $('#sheetBtn').offsetWidth;$('#sheetBtn').classList.add('pulse')}
 if(puzDone(curP)){sfx.key();$('#pmsg').textContent='🔓 퍼즐 해결!';const r=ROOM_BY[PUZ[curP].room];
  setTimeout(()=>{if(r.hs&&r.id!=='gate'&&roomReady(r))toast('🚪 어디선가 “철컥” 소리가 났다… 문으로 가 보자!','green');else if(r.id==='gate'&&puzDone('fin_metal')&&puzDone('fin_plastic'))toast('🗝️ 교문 자물쇠에 불이 들어왔다!','green');else toast('✔ 퍼즐 해결! 다른 단서를 찾아보자.','green')},400)}
 updHUD();
}
const SCARY=['…틀렸어…','뒤를 돌아보지 마','발소리가 가까워진다','손전등이 깜빡인다','누가 웃었지?','거기 누구 있어?'];
function wrong(card,msg){S.wrong++;S.battery-=12;save();sfx.bad();flash();whisper(SCARY[Math.floor(Math.random()*SCARY.length)]);
 if(card){card.classList.remove('bad');void card.offsetWidth;card.classList.add('bad');const w=card.querySelector('.wrongmsg');if(w)w.innerHTML='⚠️ '+msg}
 updHUD();if(S.battery<=0)setTimeout(jumpscare,500)}
function jumpscare(){S.caught++;S.battery=60;save();sfx.scare();const j=$('#jump');j.innerHTML=I.ghostFace+`<p>손전등이 꺼졌다… <b>재료 선생님 유령</b>에게 들켰다!<br><span style="font-size:17px;color:#aaa">“다시 쪽지를 잘 읽고 오너라…”</span></p><button class="bigbtn" id="jb">🔋 예비 배터리 끼우기</button>`;j.classList.remove('hidden');
 $('#jb').onclick=()=>{j.classList.add('hidden');updHUD()}}

/* 자물쇠 */
function keypad(n,onEnter){let v='';const draw=()=>{if($('#scr'))$('#scr').textContent=(v+'_'.repeat(n)).slice(0,n)};
 const h=`<div class="pad"><div class="screen" id="scr"></div>${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-d="${d}">${d}</button>`).join('')}<button data-d="C" style="font-size:18px">지움</button><button data-d="0">0</button><button data-d="E" style="font-size:18px;background:linear-gradient(#2f6a3e,#1a3a22)">확인</button></div>`;
 setTimeout(()=>{draw();document.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>{const d=b.dataset.d;tone(800,.05,'square',.04);if(d==='C')v='';else if(d==='E'){if(v.length===n){onEnter(v);v=''}}else if(v.length<n)v+=d;draw()})},0);return h}
function openDoor(r){openModal(`<h2>🔒 ${r.name}의 자물쇠</h2><div class="mstory">모든 퍼즐을 풀자 문 자물쇠가 희미하게 빛난다. 숫자 하나를 입력해야 한다.</div>
 <div class="lockbox"><div class="lockq"><div class="qq">${r.door.q}</div><div class="mhint" style="margin-top:12px">💡 ${r.door.hint}</div><div><button class="hbtn" onclick="openSheet()">📝 학습지 확인하기</button></div><div class="wrongmsg" id="dmsg" style="color:#ff9c90;margin-top:10px"></div></div>${keypad(1,v=>{if(v===r.door.a){S.keys[r.id]=v;save();sfx.key();updHUD();
  $('#mbox').innerHTML=`<h2>🗝️ 철컥!</h2><div class="mstory" style="font-size:20px">${r.name}의 문이 열렸다! 열쇠 번호 <b style="font-size:34px;color:#ffd166">${v}</b> 를 손에 넣었다.</div><div class="mfoot"><button class="bigbtn" onclick="renderMap()">복도로 나가기 →</button></div>`;}
 else{wrong(null,'');$('#dmsg').textContent='⚠️ 자물쇠가 피처럼 붉게 번쩍인다… 학습지를 다시 확인해 봐.'}})}</div>`)}
function openFinal(){const code=ROOMS.map(r=>S.keys[r.id]||'?').join('');
 openModal(`<h2>🚪 교문의 자물쇠</h2><div class="mstory">네 개의 방에서 모은 열쇠 번호를 <b>과학실 → 기술실 → 급식실 → 미술실</b> 순서로 입력하라.</div>
 <div class="lockbox"><div class="lockq"><div class="qq">🗝️ 모은 열쇠: ${ROOMS.map(r=>`<b style="color:#ffd166">${r.name} ${S.keys[r.id]||'?'}</b>`).join(' · ')}</div><div class="wrongmsg" id="dmsg" style="color:#ff9c90;margin-top:10px"></div></div>${keypad(4,v=>{if(v==='6322'){S.end=Date.now();save();sfx.key();closeModal();renderEnd()}else{wrong(null,'');$('#dmsg').textContent='⚠️ 순서가 맞는지 다시 봐!'}})}</div>`)}

/* =========================================================
   엔딩
========================================================= */
function renderEnd(){cur='end';stopDrone();updHUD();const tot=Object.keys(B).length,done=Object.keys(B).filter(blankDone).length;
 $('#stage').innerHTML=`<div class="cert"><h1>탈출 성공!</h1><p style="font-family:'Nanum Pen Script';font-size:28px;color:#5a1010;margin:6px 0">“…학습지를 다 채웠구나. 이제 너는 재료를 아는 사람이다. 가도 좋다.”</p>
 <p style="font-family:'Do Hyeon';font-size:22px;margin:4px 0">${S.name}</p>
 <div class="stats"><div class="stat">탈출 시간<b>${fmtTime(S.end-S.start)}</b></div><div class="stat">학습지 완성<b>${done}/${tot}</b></div><div class="stat">틀린 횟수<b>${S.wrong}</b></div><div class="stat">유령에게 잡힘<b>${S.caught}</b></div></div>
 <p style="font-size:15px;color:#5a4a3a">👉 학습지를 열어 내용을 확인하고, 선생님께 이 화면을 보여 주세요.</p>
 <div class="irow"><button class="bigbtn" onclick="openSheet()">📝 완성된 학습지 보기</button><button class="bigbtn ghost" style="color:#333;background:#fff8e6;border-color:#c9b48a" onclick="renderIntro()">처음 화면</button></div></div>`;
 sfx.key();setTimeout(()=>tone(523,1.2,'sine',.08),500);
}

/* =========================================================
   학습지
========================================================= */
const RNAME={sci:'과학실',tech:'기술실',caf:'급식실',art:'미술실'};
function bl(id){const ok=blankDone(id)||S.reveal;const cls=ok?('ok'+(newBlanks.has(id)?' new':'')+(!blankDone(id)?' tch':'')):'';return ok?`<span class="bl ${cls}">${B[id]}</span>`:`<span class="bl">🔒 ${RNAME[BL_ROOM[id]]||''}에서 찾기</span>`}
function wsHTML(){
 const row=(nm,cells)=>`<tr><td class="nm">${nm}</td>${cells.map(c=>`<td>${c}</td>`).join('')}</tr>`;
 return `
 <h4>Ⅰ. 철 금속 <span>🔬 과학실</span></h4>
 <div class="def"><b>철 금속</b>이란? ${bl('fe_def')}</div>
 <table><tr><th>종류</th><th>탄소 함량</th><th>특징</th><th>이용</th></tr>
 ${row('순철',[bl('pi_c'),bl('pi_p'),bl('pi_u')])}${row('탄소강',[bl('cs_c'),bl('cs_p'),bl('cs_u')])}${row('주철',[bl('ci_c'),bl('ci_p'),bl('ci_u')])}</table>
 <h4>Ⅱ. 비철 금속 <span>🔧 기술실</span></h4>
 <div class="def"><b>비철 금속</b>이란? ${bl('nf_def')}</div>
 <table><tr><th>종류</th><th>특징</th><th>이용</th></tr>${row('구리',[bl('cu_p'),bl('cu_u')])}${row('알루미늄',[bl('al_p'),bl('al_u')])}</table>
 <h4>Ⅲ. 비철 금속의 합금 <span>🔧 기술실</span></h4>
 <div class="def"><b>합금</b>이란? ${bl('alloy_def')}</div>
 <table><tr><th>종류</th><th>성분</th><th>특징</th><th>이용</th></tr>
 ${row('청동',[bl('br_c'),bl('br_p'),bl('br_u')])}${row('황동',[bl('bs_c'),bl('bs_p'),bl('bs_u')])}${row('두랄루민',[bl('du_c'),bl('du_p'),bl('du_u')])}</table>
 <h4>Ⅳ. 열가소성 플라스틱 <span>🍱 급식실</span></h4>
 <div class="def"><b>열가소성 플라스틱</b>: ${bl('tp_def')}<br>대부분 녹여서 재생할 수 있으므로 사용 후 ${bl('tp_recy')}을(를) 잘해야 한다.</div>
 <table><tr><th>종류</th><th>특징</th><th>이용</th></tr>
 ${row('폴리스티렌<br>(PS)',[bl('ps_p'),bl('ps_u')])}${row('폴리프로필렌<br>(PP)',[bl('pp_p'),bl('pp_u')])}${row('폴리염화 비닐<br>(PVC)',[bl('pvc_p'),bl('pvc_u')])}${row('폴리에틸렌<br>테레프탈레이트<br>(PET)',[bl('pet_p'),bl('pet_u')])}</table>
 <h4>Ⅴ. 열경화성 플라스틱 <span>🎨 미술실</span></h4>
 <div class="def"><b>열경화성 플라스틱</b>: ${bl('ts_def')}</div>
 <table><tr><th>종류</th><th>특징</th><th>이용</th></tr>
 ${row('에폭시 수지',[bl('ep_p'),bl('ep_u')])}${row('페놀 수지',[bl('ph_p'),bl('ph_u')])}${row('멜라민 수지',[bl('me_p'),bl('me_u')])}${row('탄소 섬유<br>강화 플라스틱',[`<b>성분:</b> ${bl('cf_c')}<br>${bl('cf_p')}`,bl('cf_u')])}</table>`;
}
function openSheet(){const tot=Object.keys(B).length,done=Object.keys(B).filter(blankDone).length;$('#ws').innerHTML=wsHTML();$('#sName').textContent=S.name?'— '+S.name:'';$('#sPbar').style.width=(done/tot*100)+'%';$('#sheet').classList.add('open');sfx.paper();setTimeout(()=>newBlanks.clear(),2500)}
$('#sheetBtn').onclick=openSheet;$('#closeSheet').onclick=()=>$('#sheet').classList.remove('open');
$('#sndBtn').onclick=()=>{S.sound=!S.sound;save();if(S.sound){ac();if(cur!=='intro'&&cur!=='end')startDrone()}else stopDrone();updHUD()};
function sheetText(){const L=[`[재료의 이해 학습지] ${S.name||''}`];const v=id=>blankDone(id)||S.reveal?B[id]:'(미완성)';
 L.push('■ 철 금속: '+v('fe_def'));[['순철','pi'],['탄소강','cs'],['주철','ci']].forEach(([n,p])=>L.push(`- ${n} | 탄소: ${v(p+'_c')} | 특징: ${v(p+'_p')} | 이용: ${v(p+'_u')}`));
 L.push('■ 비철 금속: '+v('nf_def'));[['구리','cu'],['알루미늄','al']].forEach(([n,p])=>L.push(`- ${n} | 특징: ${v(p+'_p')} | 이용: ${v(p+'_u')}`));
 L.push('■ 합금: '+v('alloy_def'));[['청동','br'],['황동','bs'],['두랄루민','du']].forEach(([n,p])=>L.push(`- ${n} | 성분: ${v(p+'_c')} | 특징: ${v(p+'_p')} | 이용: ${v(p+'_u')}`));
 L.push('■ 열가소성 플라스틱: '+v('tp_def')+' / 사용 후 '+v('tp_recy'));[['PS','ps'],['PP','pp'],['PVC','pvc'],['PET','pet']].forEach(([n,p])=>L.push(`- ${n} | 특징: ${v(p+'_p')} | 이용: ${v(p+'_u')}`));
 L.push('■ 열경화성 플라스틱: '+v('ts_def'));[['에폭시 수지','ep'],['페놀 수지','ph'],['멜라민 수지','me']].forEach(([n,p])=>L.push(`- ${n} | 특징: ${v(p+'_p')} | 이용: ${v(p+'_u')}`));
 L.push(`- 탄소 섬유 강화 플라스틱 | 성분: ${v('cf_c')} | 특징: ${v('cf_p')} | 이용: ${v('cf_u')}`);return L.join('\n')}
$('#copyBtn').onclick=async()=>{const t=sheetText();try{await navigator.clipboard.writeText(t);toast('📋 학습지 내용이 복사되었어요. 클래스룸·패들렛 등에 붙여 넣으세요!','green')}catch(e){openModal(`<h2>학습지 텍스트</h2><div class="mstory">아래 내용을 전체 선택(Ctrl+A) 후 복사(Ctrl+C)하세요.</div><textarea style="width:100%;height:50vh;background:#111;color:#eee;border-radius:10px;padding:10px;font-size:14px">${t}</textarea>`);$('#sheet').classList.remove('open')}};

/* =========================================================
   교사용 / 확인 상자
========================================================= */
function confirmBox(msg,yes){openModal(`<h2>확인</h2><div class="mstory">${msg}</div><div class="mfoot"><button class="hbtn" onclick="closeModal()">취소</button><button class="bigbtn" id="yesB">네</button></div>`);$('#yesB').onclick=()=>{closeModal();yes()}}
function teacherBox(){openModal(`<h2>교사용 메뉴</h2><div class="mstory">교사용 비밀번호(숫자 4자리)를 입력하세요.</div><div class="lockbox"><div class="lockq"><div class="wrongmsg" id="tmsg" style="color:#ff9c90"></div></div>${keypad(4,v=>{if(v!=='7979'){$('#tmsg').textContent='비밀번호가 틀렸습니다.';return}
 $('#mbox').innerHTML=`<button class="xbtn" onclick="closeModal()">✕</button><h2>교사용 메뉴</h2><div class="mstory">시연이나 정답 확인용 기능입니다. (학생 기기에서는 사용하지 마세요)</div>
 <div class="irow" style="justify-content:flex-start"><button class="bigbtn ghost" id="t1">${S.teacher?'✔ ':''}모든 방·교문 열기</button><button class="bigbtn ghost" id="t2">${S.reveal?'✔ ':''}학습지 정답 모두 보기</button><button class="bigbtn ghost" id="t3">진행 초기화</button></div>
 <div class="mstory" style="margin-top:14px;font-size:14px">정답: 열쇠 번호 과학실 6 · 기술실 3 · 급식실 2 · 미술실 2 → 교문 6322</div>`;
 $('#t1').onclick=()=>{S.teacher=!S.teacher;save();closeModal();renderMap()};$('#t2').onclick=()=>{S.reveal=!S.reveal;save();closeModal();openSheet()};
 $('#t3').onclick=()=>confirmBox('모든 진행 상황을 지울까요?',()=>{const snd=S.sound;S=fresh();S.sound=snd;save();renderIntro()})})}</div>`)}

/* 시작 */
renderIntro();
</script>
</body>
</html>
